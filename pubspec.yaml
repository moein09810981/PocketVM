name: pocketvm
description: PocketVM Android virtual machine manager UI.
publish_to: 'none'
version: 1.1.0+2
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  file_picker: ^10.3.3
dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true

flutter:
  uses-material-design: true
  assets:
    - app/src/main/assets/verchino_original_icon.png

flutter_launcher_icons:
  android: true
  image_path: app/src/main/assets/verchino_original_icon.png
  adaptive_icon_background: "#080B18"
  adaptive_icon_foreground: app/src/main/assets/verchino_original_icon.png
