name: Build PocketVM Flutter APK
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - access-check-20261028-2
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Flutter Android wrapper
        run: flutter create --platforms=android --project-name=pocketvm .
      - name: Prepare Flutter Android project layout
        run: |
          rm -f android/build.gradle.kts android/app/build.gradle.kts
          mkdir -p android/app
          cp settings.gradle build.gradle android/
          cp -R app/. android/app/
      - name: Flutter doctor
        run: flutter doctor -v
      - name: Remove generated starter test
        run: rm -f test/widget_test.dart
      - name: Resolve packages
        run: flutter pub get
      - name: Analyze Dart
        run: flutter analyze --no-fatal-infos
      - name: Set supported Gradle wrapper version
        run: |
          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i 's#gradle-8\.11\.1-\(all\|bin\)\.zip#gradle-8.14.3-\1.zip#' android/gradle/wrapper/gradle-wrapper.properties
          fi
      - name: Build APK
        run: flutter build apk --debug --verbose
      - uses: actions/upload-artifact@v4
        with:
          name: PocketVM-Flutter-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
