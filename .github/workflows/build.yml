name: Build PocketVM Flutter APK
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - access-check-20261028-2
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare Flutter Android project layout
        run: |
          mkdir -p android/app
          cp settings.gradle build.gradle android/
          cp -R app/. android/app/
      - name: Flutter doctor
        run: flutter doctor -v
      - name: Resolve packages
        run: flutter pub get
      - name: Analyze Dart
        run: flutter analyze
      - name: Build APK
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: PocketVM-Flutter-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
