plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'dev.flutter.flutter-gradle-plugin'
}
android {
    namespace 'com.pocketvm'
    compileSdk 35
    ndkVersion flutter.ndkVersion
    defaultConfig {
        applicationId 'com.pocketvm'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }
}
flutter { source '../..' }
