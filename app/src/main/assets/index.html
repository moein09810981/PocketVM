<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#090d12"><style>
:root{--bg:#080c11;--card:#101720;--card2:#131c26;--line:#26313d;--muted:#8c9aaa;--white:#f5f7fa;--orange:#ff650b;--green:#16d68a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 90% 8%,#24150f 0,transparent 36%),var(--bg);color:var(--white);font:14px system-ui,-apple-system,sans-serif;padding:12px 15px 95px}button{font:inherit;color:inherit;border:0;cursor:pointer}.head{display:flex;align-items:center;gap:12px;margin:8px 2px 20px}.logo{width:46px;height:46px;border-radius:15px;background:linear-gradient(145deg,#ff8a18,#ef4800);display:grid;place-items:center;color:#111;font-size:28px;font-weight:900;clip-path:polygon(50% 0,100% 42%,75% 42%,50% 22%,25% 42%,0 42%)}.brand{flex:1}.brand b{font-size:21px;display:block}.sub{font-size:11px;color:var(--muted);margin-top:3px}.iconbtn{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:10px;font-size:20px}.hero{border:1px solid #7b3c20;border-radius:23px;padding:18px;background:linear-gradient(135deg,#311b14,#15151a 58%,#101720);box-shadow:0 14px 34px #0005;position:relative;overflow:hidden}.hero:after{content:' ';position:absolute;width:170px;height:170px;border-radius:50%;background:#ff6a0b12;filter:blur(18px);left:-60px;top:-70px;pointer-events:none}.status{color:var(--green);font-size:11px;background:#103327;border-radius:20px;padding:5px 9px;display:inline-block}.heroLine{display:flex;align-items:center;justify-content:space-between;margin:13px 0 20px}.hero h1{font-size:29px;margin:0 0 5px}.penguin{font-size:48px}.specs{display:flex;justify-content:space-between;gap:6px;font-size:11px;margin:14px 0 20px;flex-wrap:wrap}.primary{width:100%;border-radius:18px;padding:15px;background:linear-gradient(100deg,#ff8a00,#ff4e00);color:#170c05;font-weight:800;font-size:15px;box-shadow:0 6px 18px #ff650b22}.dots{display:flex;justify-content:center;gap:5px;padding:11px}.dots i{width:6px;height:6px;border-radius:9px;background:#37404a}.dots i:first-child{background:var(--orange)}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:15px 2px 12px;font-size:17px;font-weight:750}.muted{color:var(--muted)}.card{background:linear-gradient(145deg,#131b24,#0e141b);border:1px solid #202b37;border-radius:18px;padding:13px;margin-bottom:10px}.machine{display:flex;align-items:center;gap:12px}.osicon{width:48px;height:48px;display:grid;place-items:center;border-radius:15px;background:#143e58;font-size:25px;flex-shrink:0}.machineinfo{flex:1;min-width:0}.machineinfo b{display:block;font-size:14px}.machineinfo small{display:block;color:var(--muted);font-size:11px;margin-top:5px}.pill{font-size:10px;background:#103327;color:var(--green);padding:6px 8px;border-radius:14px}.storage{margin-top:20px}.progress{height:6px;background:#26313c;border-radius:10px;overflow:hidden;margin-top:12px}.progress span{display:block;height:100%;width:22%;background:linear-gradient(90deg,#ff8a00,#ff4e00);border-radius:10px}.nav{position:fixed;bottom:8px;left:10px;right:10px;display:flex;background:#111820f5;border:1px solid #26313d;border-radius:22px;padding:7px;backdrop-filter:blur(16px);z-index:5}.nav button{flex:1;background:transparent;color:#8796a7;padding:7px 0;border-radius:13px;font-size:10px}.nav button span{display:block;font-size:20px;margin-bottom:3px}.nav button.active{color:var(--orange);background:#322018}.pageTitle{font-size:22px;font-weight:800;margin:7px 2px 6px}.backrow{display:flex;align-items:center;gap:12px;margin:4px 0 20px}.backrow button{background:transparent;font-size:25px}.option{display:flex;align-items:center;gap:12px}.option .machineinfo{flex:1}.radio{font-size:22px;color:var(--orange)}.range{width:100%;accent-color:var(--orange);margin-top:14px}.setting{display:flex;align-items:center;gap:12px;padding:16px 13px}.setting .glyph{font-size:22px;width:32px}.setting .machineinfo{flex:1}.terminal{background:#030609;border:1px solid #27323c;border-radius:15px;padding:15px;min-height:290px;font:12px/2 monospace;direction:ltr;text-align:left;color:#d9e7df;white-space:pre-wrap}.filters{display:flex;gap:8px;margin:15px 0}.filters button{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:9px 15px;color:var(--muted)}.filters button.active{background:var(--orange);color:#1b0d05;border-color:var(--orange)}.hidden{display:none!important}.startup{min-height:75vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;background:radial-gradient(ellipse at 50% 60%,#301b12,transparent 65%)}.startup .penguin{font-size:76px;margin-bottom:18px}.smallnote{font-size:11px;color:var(--muted);text-align:center;margin:20px 0}
</style></head><body><main id="app"></main><nav class="nav"><button data-page="home" class="active"><span>⌂</span>خانه</button><button data-page="machines"><span>▣</span>ماشین‌ها</button><button data-page="downloads"><span>⇩</span>دانلودها</button><button data-page="settings"><span>⚙</span>تنظیمات</button></nav>
<script>
const app=document.getElementById('app');let page='home',os='Alpine Linux',filter='همه',ram=2,cpu=2,disk=8;
const distributions=[['Alpine Linux','3.20 (ARM64)','سبک و سریع','▲','#164b68','سبک'],['Ubuntu','24.04 (ARM64)','محبوب و قدرتمند','◈','#d53e1d','محبوب'],['Debian','12 (ARM64)','پایدار و حرفه‌ای','◉','#94172f','محبوب'],['Fedora','41 (ARM64)','به‌روز و ایمن','f','#1853a1','محبوب'],['Arch Linux','ARM64','سریع و منعطف','A','#1e5e96','سبک']];
function head(title,back=true){return '<div class="backrow">'+(back?'<button onclick="go(\''+(page==='details'?'machines':page==='create'?'machines':page==='setting'?'settings':'home')+'\')">‹</button>':'')+'<div class="pageTitle">'+title+'</div></div>'}
function machine(name,desc,status='متوقف',sym='🐧',color='#143e58',click='details'){return '<div class="card machine" onclick="go(\''+click+'\')"><div class="osicon" style="background:'+color+'">'+sym+'</div><div class="machineinfo"><b>'+name+'</b><small>'+desc+'</small></div><span class="pill" style="'+(status==='متوقف'?'background:#202b37;color:#aab7c5':'')+'">'+status+'</span><span class="muted">⋮</span></div>'}
function button(label,fn='details'){return '<button class="primary" onclick="go(\''+fn+'\')">'+label+'</button>'}
function specs(){return '<div class="specs"><span>▣ '+ram+' GB RAM</span><span>⚙ '+cpu+' vCPU</span><span>▤ '+disk+' GB دیسک</span></div>'}
function home(){return '<div class="head"><div class="logo"></div><div class="brand"><b>PocketVM</b><div class="sub">Your VM, Your Control</div></div><button class="iconbtn" onclick="go(\'settings\')">⚙</button></div><section class="hero"><span class="status">● آماده</span><div class="heroLine"><div><h1>Linux</h1><div class="sub">Alpine Linux 3.20 (ARM64)</div></div><div class="penguin">🐧</div></div>'+specs()+button('اجرا　▶','details')+'</section><div class="dots"><i></i><i></i><i></i><i></i></div><div class="sectionhead">ماشین‌های من <span class="muted" onclick="go(\'machines\')">۱</span></div>'+machine('Linux','Alpine Linux 3.20','آماده','🐧','#173b51')+'<div class="storage card"><div class="machine"><span>▤ فضای ذخیره‌سازی</span><span class="muted" style="margin-right:auto">3.6 GB / 32 GB</span></div><div class="progress"><span></span></div></div>'}
function machines(){return head('ماشین‌های من',false)+'<div class="sectionhead">ماشین‌های مجازی <button class="iconbtn" onclick="go(\'create\')">＋</button></div>'+machine('Linux','Alpine Linux 3.20','آماده','🐧','#173b51')+machine('Ubuntu','Ubuntu 24.04','متوقف','◈','#c7381b')+machine('Debian','Debian 12','متوقف','◉','#92182e')+'<div class="storage card"><div class="machine"><span>فضای ذخیره‌سازی</span><span class="muted" style="margin-right:auto">۰ / ۳۲ GB</span></div><div class="progress"><span style="width:0"></span></div></div>'+button('＋ ساخت ماشین جدید','create')}
function create(){return head('ساخت ماشین مجازی')+'<div class="card machine"><div class="osicon">🐧</div><div class="machineinfo"><b>'+os+'</b><small>انتخاب سیستم‌عامل</small></div></div><div class="filters"><button class="active">سیستم‌عامل</button><button>پیکربندی</button><button>دیسک</button><button>سایر</button></div><div class="sectionhead">انتخاب توزیع</div>'+distributions.slice(0,4).map(d=>'<div class="card option" onclick="os=\''+d[0]+'\';render()"><div class="osicon" style="background:'+d[4]+'">'+d[3]+'</div><div class="machineinfo"><b>'+d[0]+'</b><small>'+d[2]+' · ARM64</small></div><span class="radio">'+(os===d[0]?'◉':'○')+'</span></div>').join('')+'<div class="smallnote">این رابط فعلاً پیش‌نمایش است؛ ساخت واقعی به موتور مجازی‌سازی نیاز دارد.</div>'+button('ادامه　▶','details')}
function details(){return head('جزئیات ماشین مجازی')+'<div class="card"><div class="machine"><div class="osicon">🐧</div><div class="machineinfo"><b>Linux</b><small>Alpine Linux 3.20 (ARM64)</small><small>● آمادهٔ پیکربندی</small></div></div>'+specs()+'</div><div class="sectionhead">تنظیمات سریع</div>'+slider('حافظهٔ RAM','ram',ram,16,'GB')+slider('پردازنده (vCPU)','cpu',cpu,8,'vCPU')+slider('فضای ذخیره‌سازی','disk',disk,64,'GB')+button('اجرا　▶','startup')+'<div style="height:10px"></div><button class="primary" style="background:#18222c;color:#e8edf3" onclick="go(\'console\')">باز کردن کنسول</button>'}
function slider(title,key,val,max,unit){return '<div class="card"><div class="machine"><b>'+title+'</b><span class="muted" style="margin-right:auto" id="'+key+'v">'+val+' '+unit+'</span></div><input class="range" type="range" min="1" max="'+max+'" value="'+val+'" oninput="'+key+'=+this.value;document.getElementById(\''+key+'v\').textContent=this.value+\' '+unit+'\'"></div>'}
function downloads(){return head('دانلودها',false)+'<div class="sub">توزیع‌های لینوکس برای معماری ARM64</div><div class="filters">'+['همه','سبک','محبوب'].map(x=>'<button class="'+(filter===x?'active':'')+'" onclick="filter=\''+x+'\';render()">'+x+'</button>').join('')+'</div>'+distributions.filter(d=>filter==='همه'||d[5]===filter).map(d=>'<div class="card machine"><div class="osicon" style="background:'+d[4]+'">'+d[3]+'</div><div class="machineinfo"><b>'+d[0]+'</b><small>'+d[1]+' · '+d[2]+'</small></div><button class="iconbtn" onclick="alert(\'دانلود واقعی هنوز پیاده‌سازی نشده است\')">↓</button></div>').join('')}
function settings(){return head('تنظیمات',false)+[['⚙','عمومی','زبان، ظاهر و اعلان‌ها'],['◇','شبکه','اتصال و دسترسی اینترنت'],['▤','ذخیره‌سازی','مدیریت فضای ماشین‌ها'],['◈','عملکرد','بهینه‌سازی و منابع'],['ⓘ','درباره','نسخه و اطلاعات برنامه']].map(x=>'<div class="card setting" onclick="section=\''+x[1]+'\';go(\'setting\')"><span class="glyph">'+x[0]+'</span><div class="machineinfo"><b>'+x[1]+'</b><small>'+x[2]+'</small></div><span class="muted">›</span></div>').join('')+'<div class="smallnote">PocketVM · نسخهٔ آزمایشی</div>'}
function consolePage(){return head('کنسول ماشین')+'<div class="card machine"><div class="osicon">🐧</div><div class="machineinfo"><b>Linux</b><small style="color:var(--green)">پیش‌نمایش کنسول · ماشین اجرا نیست</small></div></div><div class="terminal">Welcome to Alpine Linux 3.20!\nKernel 6.6.28-0-lts on aarch64 (tty1)\n\nalpine login: _</div><div class="smallnote">این کنسول نمایشی است و به ماشین واقعی متصل نیست.</div>'}
function startup(){return '<div class="startup" onclick="go(\'details\')"><div class="penguin">🐧</div><h2>Alpine Linux</h2><div class="sub">Starting system...</div><div class="progress" style="width:60%;margin-top:24px"><span style="width:35%"></span></div><div class="smallnote">برای بازگشت به برنامه، روی صفحه بزنید</div></div>'}
let section='عمومی';function settingPage(){return head(section)+'<div class="card"><div class="sectionhead">'+section+'</div><div class="sub">این بخش در نسخهٔ نمایشی است؛ کنترل واقعی سیستم هنوز پیاده‌سازی نشده است.</div></div>'}
function go(p){page=p;render()}function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page||(page==='details'||page==='create'||page==='console'||page==='startup')&&b.dataset.page==='machines'||page==='setting'&&b.dataset.page==='settings'));app.innerHTML=({home,machines,create,details,downloads,settings,console:consolePage,startup,setting:settingPage}[page]||home)()}document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));render();
</script></body></html>
